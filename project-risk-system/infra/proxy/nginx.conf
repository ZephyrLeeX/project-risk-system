# Reverse proxy (design §4/§7): terminates TLS, sets security headers and
# routes to the FastAPI API, the Agent SSE stream and the Vue SPA.
# Mounted into the `proxy` service (nginx:1.27-alpine) at
# /etc/nginx/conf.d/default.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS material is bind-mounted read-only from infra/proxy/certs (gitignored,
    # generated by the operator — never committed).
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security response headers (reverse proxy owns TLS + headers, ADR 0014).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Excel import uploads.
    client_max_body_size 50m;

    # Agent SSE stream — never buffer or time out the stream (ADR 0016).
    # Matched before the /api/ prefix so streaming is not broken by buffering.
    location ~ ^/api/agent/conversations/.+/events$ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # FastAPI (/api/health, /api/agent/* REST, all domain routes).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Vue SPA (static bundle served by the `web` service).
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
