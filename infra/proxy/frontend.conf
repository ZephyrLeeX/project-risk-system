# Frontend static server (baked into the `web` image at /etc/nginx/conf.d/).
# Serves the Vite-built Vue SPA with a client-side-routing fallback. /api is
# routed by the reverse proxy, never by this server.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed Vite assets: immutable long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
