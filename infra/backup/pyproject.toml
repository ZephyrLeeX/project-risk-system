# Tool configuration for the T036 encrypted backup/restore package (`risk_backup`).
#
# This is intentionally NOT an installable project: `risk_backup` reuses the
# locked `risk-platform-api` environment (cryptography / psycopg / sqlalchemy /
# pydantic + `risk_platform.shared.crypto`) and is mounted into the production
# image at runtime (ADR 0031 §12). Only the tool tables are declared here so
# Ruff / mypy / pytest run with the same rules as the application package.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["risk_backup", "risk_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["risk_platform.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
