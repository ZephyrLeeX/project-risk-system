name: CI Ruff typing fix

on:
  push:
    branches:
      - chore/add-ci-workflow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply PEP 695 generic syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/api/tests/mailbox/test_candidate_filter_sync.py")
          text = path.read_text()
          text = text.replace("from typing import Any, TypeVar, cast\n", "from typing import Any, cast\n", 1)
          text = text.replace('_T = TypeVar("_T")\n', "", 1)
          old = "def _run(coro: Coroutine[Any, Any, _T]) -> _T:\n"
          new = "def _run[T](coro: Coroutine[Any, Any, T]) -> T:\n"
          if old not in text:
              raise SystemExit("expected _run annotation not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/tests/mailbox/test_candidate_filter_sync.py
          git commit -m "style: use PEP 695 test helper generic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
