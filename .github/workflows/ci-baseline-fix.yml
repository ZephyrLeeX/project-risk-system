name: CI baseline fix

on:
  push:
    branches:
      - chore/add-ci-workflow

permissions:
  contents: write

jobs:
  fix-sim-rules:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply reviewed SIM102/SIM103 rewrites
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("apps/api/src/risk_platform/agent/core.py")
          text = core.read_text()
          old = '''        if self._scope.decide(message) is ScopeDecision.OUT_OF_SCOPE:\n            if not (\n                has_memory\n                and conversation_context is not None\n                and is_contextual_shorthand(message, conversation_context)\n            ):\n                return AgentCoreOutcome(OUT_OF_SCOPE_MESSAGE, out_of_scope=True)\n'''
          new = '''        if self._scope.decide(message) is ScopeDecision.OUT_OF_SCOPE and not (\n            has_memory\n            and conversation_context is not None\n            and is_contextual_shorthand(message, conversation_context)\n        ):\n            return AgentCoreOutcome(OUT_OF_SCOPE_MESSAGE, out_of_scope=True)\n'''
          if old not in text:
              raise SystemExit("expected agent/core.py scope-gate snippet not found")
          core.write_text(text.replace(old, new, 1))

          filtering = Path("apps/api/src/risk_platform/mailbox/filtering.py")
          text = filtering.read_text()
          old = '''        allowlist = self._normalized_allowlist()\n        if allowlist and not self._sender_matches(sender, allowlist):\n            return False\n        return True\n'''
          new = '''        allowlist = self._normalized_allowlist()\n        return not allowlist or self._sender_matches(sender, allowlist)\n'''
          if old not in text:
              raise SystemExit("expected mailbox/filtering.py allowlist snippet not found")
          filtering.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/risk_platform/agent/core.py apps/api/src/risk_platform/mailbox/filtering.py
          git commit -m "style: satisfy remaining Ruff simplifications"
          git push origin "HEAD:${GITHUB_REF_NAME}"
