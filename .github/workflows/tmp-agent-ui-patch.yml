name: Temporary Agent Drawer UI Patch

on:
  push:
    branches:
      - tmp/agent-drawer-ui-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Agent drawer UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard_path = Path("apps/web/src/views/DashboardView.vue")
          dashboard = dashboard_path.read_text()

          replacements = [
              (
                  'const manualProjectSearchOpen = ref(false);\n',
                  '',
              ),
              (
                  '''function openManualProjectSearch(): void {\n  manualProjectSearchOpen.value = true;\n  requestAnimationFrame(() => document.getElementById("agent-manual-project-name")?.focus());\n}\n\n''',
                  '',
              ),
              (
                  '''      <section v-if="agent.state.interaction?.type === 'PROJECT_SELECTION'" class="agent-interaction project-selection-card" aria-live="polite">''',
                  '''      <section v-if="agent.state.interaction?.type === 'PROJECT_SELECTION'" class="agent-interaction project-selection-card" :class="{ 'is-completed': agent.state.interaction.status !== 'OPEN' }" aria-live="polite">''',
              ),
              (
                  '''          <button v-if="!manualProjectSearchOpen" class="project-selection-secondary" type="button" :disabled="interactionSubmitting" @click="openManualProjectSearch">以上都不是，重新搜索</button>\n          <form v-else class="project-manual-search" @submit.prevent="submitManualProject"><label for="agent-manual-project-name">项目名称</label><div><input id="agent-manual-project-name" v-model="manualProjectName" placeholder="输入项目名称" maxlength="100"><button class="admin-primary-button" type="submit" :disabled="interactionSubmitting || !manualProjectName.trim()">搜索项目</button></div></form>''',
                  '''          <form class="project-manual-search" @submit.prevent="submitManualProject"><label for="agent-manual-project-name">项目名称</label><div><input id="agent-manual-project-name" v-model="manualProjectName" placeholder="输入项目名称" maxlength="100"><button class="admin-primary-button" type="submit" :disabled="interactionSubmitting || !manualProjectName.trim()">搜索项目</button></div></form>''',
              ),
              (
                  '.project-selection-list{display:grid;gap:10px}',
                  '.project-selection-list{display:grid;gap:10px;max-height:280px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}',
              ),
              (
                  '.project-selection-card>header small{color:#6b8797;line-height:1.5}',
                  '.project-selection-card>header small{color:#6b8797;line-height:1.5}.project-selection-card.is-completed{animation:project-selection-dismiss .2s ease 3s forwards;overflow:hidden}@keyframes project-selection-dismiss{to{max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;opacity:0;visibility:hidden;pointer-events:none}}',
              ),
          ]

          for old, new in replacements:
              count = dashboard.count(old)
              if count != 1:
                  raise SystemExit(f"Dashboard replacement expected once, found {count}: {old[:100]!r}")
              dashboard = dashboard.replace(old, new, 1)

          dashboard_path.write_text(dashboard)

          test_path = Path("apps/web/src/views/ui-layout-regressions.test.ts")
          tests = test_path.read_text()
          marker = '''  it("turns the send button into a durable stop button while a turn is streaming", () => {'''
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate Agent stop-button regression test marker")
          block = '''  it("keeps Agent project selection compact and search-ready", () => {\n    expect(dashboardView).not.toContain("以上都不是，重新搜索");\n    expect(dashboardView).not.toContain("manualProjectSearchOpen");\n    expect(dashboardView).toContain('class="project-manual-search"');\n    expect(dashboardView).toContain(\n      "'is-completed': agent.state.interaction.status !== 'OPEN'",\n    );\n    expect(dashboardView).toContain("max-height:280px");\n    expect(dashboardView).toContain("overflow-y:auto");\n    expect(dashboardView).toContain("animation:project-selection-dismiss");\n    expect(dashboardView).toContain("@keyframes project-selection-dismiss");\n  });\n\n'''
          tests = tests.replace(marker, block + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-agent-ui-patch.yml
          git add -- apps/web/src/views/DashboardView.vue apps/web/src/views/ui-layout-regressions.test.ts
          git commit -m "fix(agent): streamline project selection drawer"
          git push origin HEAD:tmp/agent-drawer-ui-patch
