name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-baseline:
    name: Bootstrap CI baseline
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'chore/add-ci-workflow' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --frozen

      - name: Apply safe Ruff fixes and sync contracts
        run: |
          (cd apps/api && uv run --frozen ruff check . --fix || true)
          pnpm contracts:sync

      - name: Commit generated baseline fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api packages/contracts/openapi/openapi.json packages/contracts/src/generated/openapi.ts
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "chore: align CI baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        run: pnpm check

  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_risk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_risk_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_risk_test
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --project apps/api --frozen

      - name: Ruff
        working-directory: apps/api
        run: uv run --frozen ruff check .

      - name: Mypy
        working-directory: apps/api
        run: uv run --frozen mypy .

      - name: Pytest
        working-directory: apps/api
        run: uv run --frozen pytest -ra

  contracts:
    name: Contract sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --frozen

      - name: Verify generated contracts are current
        run: pnpm contracts:check
